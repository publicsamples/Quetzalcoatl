name: Experimental HISE plugin builds

# Build the checked-in HISE export; HISE source is a dependency, not rebuilt.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out HISE source
        uses: actions/checkout@v4
        with:
          repository: RickTaylor79/HISE
          ref: a544b40ab0e67f6d1cf7e4b48ea10fdbebeb2b7b
          path: hise
          submodules: false
      - name: Initialise JUCE submodule
        run: git -C hise submodule update --init JUCE
      - name: Prepare exported plugin project
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/Quetzalcoatl/Quetzalcoatl/Binaries"
          test -f "$project/Source/PresetData.cpp" || { echo 'Commit the HISE export source before running CI' >&2; exit 1; }
          python3 scripts/prepare_export_project.py "$project/AutogeneratedProject.jucer" "$GITHUB_WORKSPACE/hise" macos
          projucer="$GITHUB_WORKSPACE/hise/JUCE/projucer/Projucer.app/Contents/MacOS/Projucer"
          chmod +x "$projucer"
          "$projucer" --resave "$project/AutogeneratedProject.jucer"
      - name: Build universal AU and VST3
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/Quetzalcoatl/Quetzalcoatl/Binaries"
          xcodebuild -project "$project/Builds/MacOSX/Quetzalcoatl.xcodeproj" -configuration Release -jobs 2 ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify both macOS plugins are universal
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/Quetzalcoatl/Quetzalcoatl/Binaries/Builds/MacOSX/build/Release"
          for bundle in "$output/Quetzalcoatl.component" "$output/Quetzalcoatl.vst3"; do
            test -d "$bundle" || { echo "Missing plugin: $bundle" >&2; exit 1; }
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            binary="$bundle/Contents/MacOS/$executable"
            lipo -verify_arch arm64 x86_64 "$binary"
            lipo -archs "$binary"
          done
      - name: Upload experimental plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: experimental-macos-plugins
          path: |
            Quetzalcoatl/Quetzalcoatl/Binaries/Builds/MacOSX/build/Release/*.component
            Quetzalcoatl/Quetzalcoatl/Binaries/Builds/MacOSX/build/Release/*.vst3
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out HISE source
        uses: actions/checkout@v4
        with:
          repository: RickTaylor79/HISE
          ref: a544b40ab0e67f6d1cf7e4b48ea10fdbebeb2b7b
          path: hise
          submodules: false
      - name: Initialise JUCE submodule
        run: git -C hise submodule update --init JUCE
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Prepare exported plugin project
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'Quetzalcoatl/Quetzalcoatl/Binaries'
          if (-not (Test-Path "$project/Source/PresetData.cpp")) { throw 'Commit the HISE export source before running CI' }
          python scripts/prepare_export_project.py "$project/AutogeneratedProject.jucer" "$env:GITHUB_WORKSPACE/hise" windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projucer = Join-Path $env:GITHUB_WORKSPACE 'hise/JUCE/projucer/Projucer.exe'
          $file = Join-Path $project 'AutogeneratedProject.jucer'
          $proc = Start-Process -FilePath $projucer -ArgumentList @('--resave', ('"{0}"' -f $file)) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Projucer failed: $($proc.ExitCode)" }
      - name: Build VST3
        shell: pwsh
        run: |
          $solution = Join-Path $env:GITHUB_WORKSPACE 'Quetzalcoatl/Quetzalcoatl/Binaries/Builds/VisualStudio2022/Quetzalcoatl.sln'
          & MSBuild.exe $solution /t:Build '/p:Configuration=Release;Platform=x64' /m:2 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload experimental plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-plugin
          path: Quetzalcoatl/Quetzalcoatl/Binaries/Builds/VisualStudio2022/x64/Release/VST3/*.vst3
          if-no-files-found: error
          retention-days: 7
