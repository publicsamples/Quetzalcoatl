name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HISE project files
        run: python3 scripts/check_project.py
      - name: Test content staging and timestamps
        run: python3 tests/test_stage_content.py
      - name: Test sample staging and timestamps
        run: python3 tests/test_stage_samples.py
      - name: Test platform-specific export settings
        run: python3 tests/test_export_settings.py
      - name: Test Linux installation rules
        run: python3 tests/test_linux_install.py
      - name: Test Linux optional sample download
        run: python3 tests/test_linux_download.py

  macos-content-merge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test content merge rules
        run: bash tests/test_macos_merge.sh
      - name: Test macOS sample installation
        run: bash tests/test_macos_samples.sh
      - name: Test macOS package creation
        run: bash tests/test_macos_package.sh

  windows-content-merge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test content merge rules
        shell: pwsh
        run: ./tests/test_windows_merge.ps1
      - name: Test Windows sample installation
        shell: pwsh
        run: ./tests/test_windows_samples.ps1
      - name: Test Windows installer compilation
        shell: pwsh
        run: ./tests/test_windows_package.ps1
